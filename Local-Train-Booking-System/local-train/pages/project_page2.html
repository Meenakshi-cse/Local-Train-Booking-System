<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Local Train Booking System</title>
  <link rel="stylesheet" href="../css/style1.css">
</head>
<body>
  <div class="container">
    <h2>Register for Local Train Booking</h2>
    <p class="subtitle">Create a new account</p>
    <form onsubmit="registerUser(event)">
      <label for="username">Username</label>
      <input type="text" id="username" required minlength="8" maxlength="12" autocomplete="username" placeholder="8-12 characters">
      <div class="input-hint">Must be 8 to 12 characters</div>

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8" maxlength="12" autocomplete="new-password" placeholder="8-12 characters">
      <div class="input-hint">Must be 8 to 12 characters</div>

      <button type="submit">Register</button>
    </form>
    <h4>Already Registered? <a href="project_page1.html">Login here</a></h4>
  </div>

  <script>
    function registerUser(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username.length < 8 || username.length > 12) {
        alert("Username must be between 8 and 12 characters.");
        return;
      }
      if (password.length < 8 || password.length > 12) {
        alert("Password must be between 8 and 12 characters.");
        return;
      }

      // Read existing users
      let users = [];
      try {
        const storedUsers = JSON.parse(localStorage.getItem("users"));
        if (Array.isArray(storedUsers)) {
          users = storedUsers;
        }
      } catch (err) {}

      // Check for duplicate username
      if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        alert("Username already exists. Please choose a different username.");
        return;
      }

      const newUser = { username, password };
      users.push(newUser);

      // Save both to users list and single user for full compatibility
      localStorage.setItem("users", JSON.stringify(users));
      localStorage.setItem("user", JSON.stringify(newUser));

      alert("Registration successful! You can now log in.");
      window.location.href = "project_page1.html";
    }
  </script>
</body>
</html>
