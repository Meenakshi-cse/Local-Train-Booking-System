<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Local Train Booking System</title>
  <link rel="stylesheet" href="../css/style1.css">
</head>
<body>
  <div class="container">
    <h2>Local Train Booking System</h2>
    <p class="subtitle">Please log in to your account</p>
    <form onsubmit="loginUser(event)">
      <label for="username">Username</label>
      <input type="text" id="username" required autocomplete="username" placeholder="Enter your username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="Enter your password">

      <button type="submit">Login</button>
    </form>
    <h4>Not Registered? <a href="project_page2.html">Register here</a></h4>
  </div>

  <script>
    function loginUser(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      // Read users from both "users" list and single "user" object for compatibility
      let users = [];
      try {
        const storedUsers = JSON.parse(localStorage.getItem("users"));
        if (Array.isArray(storedUsers)) {
          users = storedUsers;
        }
      } catch (err) {}

      try {
        const singleUser = JSON.parse(localStorage.getItem("user"));
        if (singleUser && singleUser.username) {
          if (!users.some(u => u.username === singleUser.username)) {
            users.push(singleUser);
          }
        }
      } catch (err) {}

      if (users.length === 0) {
        alert("No user registered yet. Please register first.");
        window.location.href = "project_page2.html";
        return;
      }

      const matchedUser = users.find(u => u.username === username && u.password === password);

      if (matchedUser) {
        // Save current session
        const sessionData = { username: matchedUser.username, loginTime: new Date().toISOString() };
        localStorage.setItem("currentUser", JSON.stringify(sessionData));
        sessionStorage.setItem("currentUser", JSON.stringify(sessionData));
        alert("Login successful!");
        window.location.href = "project_page3.html";
      } else {
        alert("Invalid username or password. Please try again.");
      }
    }
  </script>
</body>
</html>
