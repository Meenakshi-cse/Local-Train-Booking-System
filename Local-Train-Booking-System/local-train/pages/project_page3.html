<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Local Train Booking System</title>
  <link rel="stylesheet" href="../css/style1.css">
</head>
<body>
  <div class="container">
    <h2>Welcome to Your Dashboard</h2>
    <p class="subtitle" id="greetingText">Hello, Passenger!</p>

    <button type="button" class="btn" onclick="window.location.href='project_page_booking.html'">Book a Ticket</button>
    <button type="button" class="btn" onclick="window.location.href='project_page4.html'">View Last Ticket</button>
    <button type="button" class="btn btn-secondary" onclick="logoutUser()">Logout</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Check current session
      let currentUser = null;
      try {
        currentUser = JSON.parse(sessionStorage.getItem("currentUser")) || JSON.parse(localStorage.getItem("currentUser"));
      } catch (e) {}

      if (!currentUser) {
        // Fallback to registered user if available
        try {
          currentUser = JSON.parse(localStorage.getItem("user"));
        } catch (e) {}
      }

      if (currentUser && currentUser.username) {
        document.getElementById("greetingText").textContent = `Logged in as: ${currentUser.username}`;
      }
    });

    function logoutUser() {
      sessionStorage.removeItem("currentUser");
      localStorage.removeItem("currentUser");
      alert("You have been logged out.");
      window.location.href = "project_page1.html";
    }
  </script>
</body>
</html>
